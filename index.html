<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thomas Player</title>
  <style>
    :root{
      --card-w: min(85vw, 640px);
      --card-h: calc(var(--card-w) * 0.62);
      --line-gap: calc(var(--card-h) / 12);
      --paper:#fbfaf7;
      --ink:#1f1f1f;
      --shadow: 0 25px 35px rgba(0,0,0,.22), 0 8px 12px rgba(0,0,0,.14);
      --shadow-lift: 0 40px 60px rgba(0,0,0,.25), 0 10px 16px rgba(0,0,0,.16);
    }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1200px 800px at 20% -10%, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(1000px 600px at 90% 120%, rgba(0,0,0,.2), transparent 50%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, rgba(0,0,0,.02) 2px 4px),
        linear-gradient(180deg, #e6dccf, #d2c5b6);
    }

    .stack{ position:relative; perspective: 1200px; }

    .pin{ position:absolute; left:50%; top:18px; transform:translateX(-50%); z-index:3; }
    .pin .head{
      width:clamp(14px, 3vw, 20px); height:clamp(14px, 3vw, 20px); border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #ff6473, #e51d2c 60%, #a40f19 100%);
      box-shadow: 0 6px 10px rgba(0,0,0,.35);
    }
    .pin-shadow{
      position:absolute; left:50%; top:24px; transform:translateX(-50%);
      width:clamp(30px, 8vw, 50px); height:clamp(12px, 2.5vw, 20px); border-radius:50%;
      background: radial-gradient(closest-side, rgba(0,0,0,.22), rgba(0,0,0,0));
      filter: blur(5px); opacity:.45; z-index:1; pointer-events:none;
    }

    .card{
      position:relative;
      width: var(--card-w);
      height: var(--card-h);
      background:
        repeating-linear-gradient(to bottom, transparent 0 var(--line-gap), rgba(10,88,255,.18) var(--line-gap) calc(var(--line-gap) + 1px)),
        linear-gradient(90deg, transparent 66px, rgba(255,59,48,.28) 67px, transparent 68px),
        radial-gradient(120% 100% at 50% -12%, rgba(255,255,255,.7), transparent 62%),
        var(--paper);
      border-radius: 0;
      box-shadow: var(--shadow);
      transform: rotate(-2deg);
      transform-origin: 50% 18px;
      transition: transform .25s ease, box-shadow .25s ease;
      isolation:isolate;
      overflow:hidden;
    }

    .stack:hover .card,
    .stack.touch-active .card{
      transform: rotate(-1deg) scale(1.01);
      transform-origin: 50% 18px;
      box-shadow: var(--shadow-lift);
    }

    .content{
      position:absolute; inset: clamp(50px, 12%, 70px) 8% 10% clamp(60px, 12%, 90px);
      display:flex; flex-direction:column; gap:clamp(8px, 2.5vw, 14px);
      justify-content:center;
      height:calc(100% - clamp(80px, 20%, 120px));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      text-shadow: 0 .5px 0 rgba(0,0,0,.05);
      user-select:text;
    }
    .title{ font-size: clamp(24px, 6vw, 64px); line-height:1.05; font-weight:bold; }
    .subtitle{ font-size: clamp(16px, 3.8vw, 26px); opacity:.9; }
    .email{ font-size: clamp(16px, 4vw, 28px); letter-spacing:.2px; font-family: Courier New, Arial, Helvetica, sans-serif;}
    .email a{ color: inherit; text-decoration: none; border-bottom: 2px solid rgba(0,0,0,.18); }
    .email a:focus-visible{ outline: 2px dashed rgba(0,0,0,.45); outline-offset: 3px; }

    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <div class="stack" aria-label="A realistic index card">
    <div class="pin" aria-hidden="true"><div class="head"></div></div>
    <span class="pin-shadow" aria-hidden="true"></span>
    <div class="card" role="img" aria-label="Ruled index card with a red pin head">
      <div class="content">
        <div class="title">Thomas Player</div>
        <div class="subtitle">Science writer and tutor in Oxford</div>
        <div class="email"><a href="mailto:hello@thomasplayer.me">hello@thomasplayer.me</a></div>
      </div>
    </div>
  </div>
  <span class="sr-only">A single ruled index card with sharp corners, a red pin head placed between ruled lines at the top, showing the name Thomas Player, the line “Science writer and tutor in Oxford” and the email address hello@thomasplayer.me.</span>
  <script>
    document.addEventListener('touchstart', function(e) {
      const stack = e.target.closest('.stack');
      if (stack) {
        stack.classList.add('touch-active');
      }
    });
    document.addEventListener('touchend', function(e) {
      document.querySelectorAll('.stack.touch-active').forEach(el => el.classList.remove('touch-active'));
    });
  </script>
</body>
</html>
