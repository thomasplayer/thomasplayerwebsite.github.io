name: Update News Page

on:
  schedule:
    # runs daily at 06:55 UTC — change to your desired UTC time
    - cron: '35 06 * * *'
    - cron: '05 12 * * *'
  workflow_dispatch: {}  # allows manual runs from Actions UI

permissions:
  contents: write  # required to commit back to the repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run digest script
        run: |
          python daily_news_digest.py

      - name: Show git status (debug)
        run: |
          git status --porcelain || true
          git --no-pager log -n 3 --oneline || true

      - name: Commit and push digest files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.html archive/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated: update news digest $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD:main
            echo "Pushed digest.html and archive."
          fi

      - name: Upload run logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-run-log
          path: |
            digest.log
            digest.html
            archive/*.html
